{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Change Password</title>

<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

<style>

:root{
  --bg:#080B10;
  --bg2:#0C1018;
  --surface:rgba(255,255,255,0.05);
  --border:rgba(255,255,255,0.08);

  --orange:#FF6B2B;
  --orange2:#FF9A5C;

  --white:#ffffff;
  --text:#E2E8F0;
  --grey:#8A93A8;
}

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{
  font-family:'Plus Jakarta Sans',sans-serif;
  min-height:100vh;
  background:linear-gradient(135deg,#080B10,#0C1018,#111620);
  overflow-x:hidden;
  overflow-y:auto;
  color:var(--text);

  display:flex;
  align-items:center;
  justify-content:center;

  position:relative;
}

/* BACKGROUND ORBS */

.orb{
  position:absolute;
  border-radius:50%;
  filter:blur(120px);
  pointer-events:none;
}

.orb1{
  width:500px;
  height:500px;
  background:rgba(255,107,43,0.12);
  top:-150px;
  right:-100px;
}

.orb2{
  width:400px;
  height:400px;
  background:rgba(0,212,170,0.08);
  bottom:-100px;
  left:-100px;
}

/* CARD */

.login-box{
  width:100%;
  max-width:420px;

  padding:42px;

  border-radius:28px;

  background:rgba(10,12,18,0.88);

  backdrop-filter:blur(30px);

  border:1px solid rgba(255,255,255,0.08);

  box-shadow:0 30px 60px rgba(0,0,0,0.45);

  position:relative;
  z-index:2;
}

.login-box::before{
  content:'';
  position:absolute;
  top:0;
  left:0;
  width:100%;
  height:4px;

  border-radius:28px 28px 0 0;

  background:linear-gradient(90deg,var(--orange),var(--orange2));
}

/* TITLE */

h2{
  text-align:center;

  color:white;

  font-size:38px;
  font-weight:800;

  letter-spacing:-2px;

  margin-bottom:32px;
}

/* LABEL */

label{
  display:block;

  margin-top:18px;
  margin-bottom:10px;

  font-size:14px;
  font-weight:500;

  color:#d6dbe5;
}

/* INPUT */

input[type="password"]{
  width:100%;

  padding:16px 18px;

  border-radius:16px;

  border:1px solid rgba(255,255,255,0.08);

  background:rgba(255,255,255,0.04);

  color:white;

  font-size:15px;

  transition:0.3s;
}

input[type="password"]::placeholder{
  color:#8A93A8;
}

input[type="password"]:hover{
  border-color:rgba(255,107,43,0.35);
}

input[type="password"]:focus{
  outline:none;

  border-color:var(--orange);

  box-shadow:0 0 0 4px rgba(255,107,43,0.12);

  transform:translateY(-2px);
}

/* ERRORS */

.errorlist{
  list-style:none;
  margin-top:8px;
  padding:0;
}

.errorlist li{
  color:#ff7b7b;
  font-size:13px;
  margin-top:4px;
}

/* BUTTON */

button[type="submit"]{
  width:100%;

  margin-top:30px;

  padding:16px;

  border:none;

  border-radius:16px;

  background:linear-gradient(135deg,var(--orange),#e03a00);

  color:white;

  font-size:15px;
  font-weight:700;

  cursor:pointer;

  transition:0.35s;
}

button[type="submit"]:hover{
  transform:translateY(-5px);

  box-shadow:0 20px 40px rgba(255,107,43,0.25);
}

/* LINKS */

.links{
  margin-top:24px;

  text-align:center;

  font-size:14px;
}

.links a{
  color:#9bbcff;
  text-decoration:none;
}

.links a:hover{
  color:var(--orange);
}

/* MOBILE */

@media(max-width:520px){

  .login-box{
    margin:20px;
    padding:30px 24px;
  }

  h2{
    font-size:32px;
  }

}

</style>
</head>

<body>

<div class="orb orb1"></div>
<div class="orb orb2"></div>

<div class="login-box">

  <h2>Change Password</h2>

  {% if messages %}
    {% for message in messages %}

      <script>
        alert("{{ message }}");
      </script>

    {% endfor %}
  {% endif %}

  <form method="POST">

    {% csrf_token %}

    <label>Old Password</label>
    <input type="password" name="old_password" placeholder="Enter current password">
    {{ form.old_password.errors }}

    <label>New Password</label>
    <input type="password" name="new_password1" placeholder="Enter new password">
    {{ form.new_password1.errors }}

    <label>Confirm New Password</label>
    <input type="password" name="new_password2" placeholder="Confirm new password">
    {{ form.new_password2.errors }}

    <button type="submit">
      Update Password
    </button>

  </form>

  <div class="links">
    <a href="{% url 'profile' %}">
      Back to Profile
    </a>
  </div>

</div>

</body>
</html>
